<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>event-stream-platform — live fleet</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0d12; color: #e6e8ee;
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap;
           padding: 10px 14px; border-bottom: 1px solid #1d2230; }
  h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .muted { color: #7b8496; }
  #state { margin-left: auto; }
  #state.live { color: #4ade80; }
  #state.down { color: #f87171; }
  main { display: grid; grid-template-columns: 1fr 260px; height: calc(100vh - 41px); }
  canvas { width: 100%; height: 100%; display: block; }
  aside { border-left: 1px solid #1d2230; overflow-y: auto; padding: 10px 12px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 3px 0; vertical-align: top; }
  td:first-child { color: #7b8496; width: 92px; }
  #log { margin-top: 10px; border-top: 1px solid #1d2230; padding-top: 8px; }
  #log div { color: #7b8496; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log div:first-child { color: #cbd5e1; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<header>
  <h1>live fleet</h1>
  <span class="muted">SSE &middot; resumes from Last-Event-ID</span>
  <span id="state" class="down">connecting…</span>
</header>
<main>
  <canvas id="c"></canvas>
  <aside>
    <table>
      <tr><td>vehicles</td><td id="vehicles">0</td></tr>
      <tr><td>frames</td><td id="frames">0</td></tr>
      <tr><td>replayed</td><td id="replayed">0</td></tr>
      <tr><td>last id</td><td id="lastid" style="word-break:break-all">—</td></tr>
    </table>
    <div id="log"></div>
  </aside>
</main>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  var state = document.getElementById("state");
  var vehicles = new Map();
  // The browser keeps the resume point for us: each frame carries an "id:" line, and
  // EventSource reconnects on its own and sends the last one it saw as Last-Event-ID. That id
  // is the event's identity rather than a counter, which is what makes the reconnect resumable
  // against the durable history — a counter would mean nothing there.
  var frames = 0, replayed = 0, bbox = null;

  function resize() {
    var r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function bounds(p) {
    if (!bbox) bbox = { n: p.lat, s: p.lat, e: p.lon, w: p.lon };
    bbox.n = Math.max(bbox.n, p.lat); bbox.s = Math.min(bbox.s, p.lat);
    bbox.e = Math.max(bbox.e, p.lon); bbox.w = Math.min(bbox.w, p.lon);
  }

  function project(p) {
    var r = canvas.getBoundingClientRect(), pad = 34;
    var spanLat = Math.max(bbox.n - bbox.s, 1e-4), spanLon = Math.max(bbox.e - bbox.w, 1e-4);
    var scale = Math.min((r.width - pad * 2) / spanLon, (r.height - pad * 2) / spanLat);
    return {
      x: pad + (p.lon - bbox.w) * scale + (r.width - pad * 2 - spanLon * scale) / 2,
      y: r.height - pad - (p.lat - bbox.s) * scale - (r.height - pad * 2 - spanLat * scale) / 2
    };
  }

  function speedColor(kph) {
    if (kph == null) return "#64748b";
    // Cool to warm, clamped. The palette is the only place speed is encoded, so it has to be
    // readable at a glance rather than a precise scale.
    var t = Math.max(0, Math.min(1, kph / 80));
    return "hsl(" + Math.round(200 - 200 * t) + " 85% " + Math.round(52 + 10 * t) + "%)";
  }

  function draw() {
    var r = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, r.width, r.height);
    if (!bbox) {
      ctx.fillStyle = "#7b8496";
      ctx.fillText("waiting for the first position…", 18, 28);
      return;
    }
    vehicles.forEach(function (v) {
      var q = project(v);
      ctx.beginPath();
      ctx.arc(q.x, q.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = speedColor(v.speed_kph);
      ctx.fill();
      ctx.fillStyle = "#cbd5e1";
      ctx.fillText(v.vehicle_id, q.x + 9, q.y + 4);
    });
  }

  function note(text) {
    var log = document.getElementById("log");
    var d = document.createElement("div");
    d.textContent = new Date().toLocaleTimeString() + "  " + text;
    log.insertBefore(d, log.firstChild);
    while (log.childNodes.length > 14) log.removeChild(log.lastChild);
  }

  function set(id, value) { document.getElementById(id).textContent = value; }

  function onFrame(name, data) {
    if (name === "position") {
      var p = data;
      // Upsert by vehicle, keeping the newer event: a late event can arrive after the one that
      // superseded it, and the map must not walk backwards any more than the server's
      // current-state table does.
      var prev = vehicles.get(p.vehicle_id);
      if (!prev || Date.parse(p.event_ts) >= Date.parse(prev.event_ts)) vehicles.set(p.vehicle_id, p);
      bounds(p);
      frames++; set("frames", frames); set("vehicles", vehicles.size);
      set("lastid", p.event_id);
      draw();
      return;
    }
    if (name === "ready") { state.className = "live"; state.textContent = "live"; note("stream open (fresh)"); return; }
    if (name === "resumed") {
      replayed += data.frames || 0; set("replayed", replayed);
      state.className = "live"; state.textContent = "live";
      note("resumed: " + (data.frames || 0) + " missed frame(s) from " + data.from);
      return;
    }
    if (name === "reset") { note("server asked for a fresh start: " + data.reason); return; }
    if (name === "shed") { note("server closed the stream: " + data.reason); return; }
    if (name === "error") { note("server reported: " + data.reason); return; }
  }

  var es = new EventSource("/v1/stream");
  es.addEventListener("position", function (e) { onFrame("position", JSON.parse(e.data)); });
  es.addEventListener("ready", function (e) { onFrame("ready", JSON.parse(e.data)); });
  es.addEventListener("resumed", function (e) { onFrame("resumed", JSON.parse(e.data)); });
  es.addEventListener("reset", function (e) { onFrame("reset", JSON.parse(e.data)); });
  es.addEventListener("shed", function (e) { onFrame("shed", JSON.parse(e.data)); });
  es.addEventListener("error", function () {
    // Both a transport failure and the server's own error frame land here; the browser
    // reconnects either way, so this reports rather than reacts.
    state.className = "down"; state.textContent = "reconnecting…";
  });
  es.addEventListener("open", function () { state.className = "live"; state.textContent = "live"; });

  window.addEventListener("resize", resize);
  resize();
})();
</script>
</body>
</html>

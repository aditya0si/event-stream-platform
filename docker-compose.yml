# event-stream-platform — local stack.
#
# Everything a reviewer needs runs here: two databases, the broker, the one-shot migration
# step, and the ingest service. `docker compose up --build` is the whole setup.
#
# Ports are deliberately offset from the sibling project (tenant-api-platform) so both
# stacks can run at once without one clobbering the other:
#
#   postgres   5433   (sibling uses 5432)
#   redis      6380   (sibling uses 6379)
#   redpanda  19092   (external Kafka listener; containers use redpanda:9092)
#   ingest     8081   (sibling's API uses 8080)
#   consumer   9091   (metrics/health; sibling's worker uses 9090)
#   gateway    8082
#
# Redpanda exposes two Kafka listeners on purpose: `internal` is what containers dial, and
# `external` is what a binary running on the host dials. The advertised addresses differ
# per listener — a single listener cannot serve both, because the broker hands clients the
# address they must reconnect to, and "localhost" means something different inside a
# container than outside one.

name: event-stream-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: esp-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: esp
      POSTGRES_PASSWORD: esp
      POSTGRES_DB: event_stream
    volumes:
      - esp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esp -d event_stream"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: esp-redis
    ports:
      - "6380:6379"
    # Append-only persistence is enabled even though the fan-out bus is best-effort
    # (ADR-009): the channel is not the durable record, but a restart mid-demo should not
    # look like a bug.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - esp_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v26.2.2
    container_name: esp-redpanda
    command:
      - redpanda
      - start
      # One core and 1G: this broker is a portfolio-sized deployment, not a cluster, and
      # the resource ceiling is stated rather than hidden. --overprovisioned tells Redpanda
      # it does not own the machine, which is true in a shared Docker VM.
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Two listeners: internal for containers, external for host-run binaries.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - esp_redpandadata:/var/lib/redpanda/data
    # The healthcheck asks the broker whether it considers itself healthy, rather than
    # merely whether the port is open. A Redpanda node that has bound its listener but not
    # yet formed a cluster answers TCP and fails metadata requests, which is exactly the
    # window in which `migrate` would fail if the two were conflated.
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Applies the schema and ensures the topics exist, then exits. The ingest service waits
  # for this to complete so a fresh `compose up` never serves traffic against a schema
  # that does not exist yet.
  #
  # entrypoint is overridden because the image's default entrypoint is /bin/ingest;
  # without this, `command` would be passed to the ingest binary as arguments.
  migrate:
    build: .
    container_name: esp-migrate
    entrypoint: ["/bin/migrate", "all"]
    environment:
      APP_ENV: dev
      LOG_LEVEL: info
      DATABASE_URL: postgres://esp:esp@postgres:5432/event_stream?sslmode=disable
      BROKER_SEEDS: redpanda:9092
      BROKER_RAW_TOPIC: telemetry.raw.v1
      BROKER_DLQ_TOPIC: telemetry.dlq.v1
      BROKER_RAW_PARTITIONS: "6"
      BROKER_DLQ_PARTITIONS: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: "no"

  ingest:
    build: .
    container_name: esp-ingest
    ports:
      - "8081:8081"
    environment:
      APP_ENV: dev
      LOG_LEVEL: info
      DATABASE_URL: postgres://esp:esp@postgres:5432/event_stream?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # Internal listener: this process runs inside the compose network.
      BROKER_SEEDS: redpanda:9092
      INGEST_ADDR: ":8081"
      # No API key in dev; the config refuses to boot without one when APP_ENV=prod.
      INGEST_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8081/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # The consumer group member: it reads the log, applies events to Postgres, and commits
  # offsets only after the transaction that applied them commits.
  #
  # This service is not optional, and its absence is the failure worth naming: without it the
  # ingest endpoint accepts events, the log fills, and Postgres stays empty. The system would
  # look healthy from every other angle — topics growing, readiness green — while nothing a
  # reviewer queried actually existed.
  #
  # Metrics and readiness on their own port, because the consumer has no public API. In
  # production this listener stays on the internal network: consumer lag is operational data.
  consumer:
    build: .
    container_name: esp-consumer
    entrypoint: ["/bin/consumer"]
    ports:
      - "9091:9091"
    environment:
      APP_ENV: dev
      LOG_LEVEL: info
      DATABASE_URL: postgres://esp:esp@postgres:5432/event_stream?sslmode=disable
      # The fan-out bus (ADR-009). The consumer publishes each committed event to it, so Redis
      # is a start-up dependency for this process: it pings and exits when unreachable, which
      # is what a crash loop in this container means rather than a silent degradation.
      REDIS_URL: redis://redis:6379/0
      BROKER_SEEDS: redpanda:9092
      BROKER_RAW_TOPIC: telemetry.raw.v1
      BROKER_DLQ_TOPIC: telemetry.dlq.v1
      CONSUMER_GROUP: sink-v1
      CONSUMER_METRICS_ADDR: ":9091"
      CONSUMER_BATCH_SIZE: "200"
      CONSUMER_MAX_RETRIES: "5"
      CONSUMER_RETRY_BACKOFF_BASE: 250ms
      CONSUMER_RETRY_BACKOFF_MAX: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      # Now a start-up requirement, not just a runtime one: the process pings Redis and exits
      # if it cannot reach it, so a cold `up` must not race the bus into a crash loop.
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # The healthcheck asks the database and the broker, not just the process: a consumer whose
    # connection is gone cannot apply anything, and reporting it healthy would hide a log that
    # is filling while the sink stands still.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9091/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # The operator's replay CLI, as a one-off container.
  #
  # It is under a profile so `docker compose up` does not start it: a CLI that runs, prints, and
  # exits would sit there restarting and look like a crash loop. Naming it explicitly still
  # works (`docker compose run --rm replay ...`), because targeting a service enables its
  # profile.
  #
  # It runs the same image as everything else (ADR-007), so the tool an operator reaches for
  # during an incident is built from the same commit as the consumer whose refusals it reads.
  replay:
    build: .
    entrypoint: ["/bin/replay"]
    profiles: ["tools"]
    environment:
      APP_ENV: dev
      LOG_LEVEL: info
      DATABASE_URL: postgres://esp:esp@postgres:5432/event_stream?sslmode=disable
      BROKER_SEEDS: redpanda:9092
      BROKER_RAW_TOPIC: telemetry.raw.v1
      BROKER_DLQ_TOPIC: telemetry.dlq.v1
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # The SSE gateway: browser-facing, read-only, and the only process that serves a human.
  #
  # It depends on Postgres and Redis but not on the broker: a resume reads the durable history,
  # and live frames arrive over the bus. That is why this service can be restarted, moved, or
  # scaled without a consumer-group rebalance anywhere.
  gateway:
    build: .
    container_name: esp-gateway
    entrypoint: ["/bin/gateway"]
    ports:
      - "8082:8082"
    environment:
      APP_ENV: dev
      LOG_LEVEL: info
      DATABASE_URL: postgres://esp:esp@postgres:5432/event_stream?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      GATEWAY_ADDR: ":8082"
      GATEWAY_CLIENT_BUFFER: "256"
      GATEWAY_MAX_CLIENTS: "1000"
      GATEWAY_REPLAY_WINDOW: 15m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Readiness asks Postgres and Redis, and nothing else: those are the two things this process
    # cannot serve a stream without.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8082/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  esp_pgdata:
  esp_redisdata:
  esp_redpandadata:
